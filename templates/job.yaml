{{- if .Values.restore.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-postgres-restore"
spec:
  template:
    spec:
      containers:
        - name: restore
          image: "{{ .Values.restore.image.repository }}:{{ .Values.restore.image.tag }}"
          command:
            - sh
            - -c
            - |
              set -e

              BACKUP_DIR=$(ls -drt /backups/${HELM_RELEASE_NAME}_backup_* 2>/dev/null | tail -n 1)
              if [ -z "$BACKUP_DIR" ]; then
                echo "Error: No backup directory found in /backups"
                exit 1
              fi

              echo "Found backup: $BACKUP_DIR"

              # Verify backup exists and is non-empty
              if [ ! -s "$BACKUP_DIR/base.tar.gz" ]; then
                echo "ERROR: base.tar.gz is missing or empty"
                exit 1
              fi

              # Extract backup to a temp location first
              TEMP_DIR=$(mktemp -d)
              echo "Extracting backup to temp directory..."
              tar -xzf "$BACKUP_DIR/base.tar.gz" -C "$TEMP_DIR"

              # Verify extracted data
              if [ ! -d "$TEMP_DIR/base" ]; then
                echo "ERROR: Extracted backup does not contain expected base directory"
                exit 1
              fi

              echo "Backup extracted successfully."

              # Copy backup_label to temp directory for reference
              if [ -f "$BACKUP_DIR/backup_label" ]; then
                cp "$BACKUP_DIR/backup_label" "$TEMP_DIR/"
              fi

              # Replace PostgreSQL data directory
              PGDATA=/var/lib/postgresql/data/postgres
              echo "Replacing PostgreSQL data directory at $PGDATA..."
              rm -rf "$PGDATA"
              cp -a "$TEMP_DIR/base" "$PGDATA"

              # Copy backup_label if present
              if [ -f "$TEMP_DIR/backup_label" ]; then
                cp "$TEMP_DIR/backup_label" "$PGDATA/"
              fi

              # Clean up temp directory
              rm -rf "$TEMP_DIR"

              echo "Restore complete. PostgreSQL data directory has been replaced."
              echo "Restart the PostgreSQL deployment to apply the restored data."
          env:
            - name: HELM_RELEASE_NAME
              value: "{{ .Release.Name }}"
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-env"
                  key: DB_HOSTNAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-env"
                  key: DB_USERNAME
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-env"
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-env"
                  key: DB_DATABASE_NAME
          volumeMounts:
            - name: backup-storage
              mountPath: /backups
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-postgres-db-pvc"
        - name: pgdata
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-postgres-db-pvc"
      restartPolicy: OnFailure
{{- end }}
