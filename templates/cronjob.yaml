apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Release.Name }}-postgres-backup"
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              command:
                - sh
                - -c
                - |
                  set -e

                  BACKUP_DIR=/backups/${HELM_RELEASE_NAME}_backup_$(date +%Y-%m-%d_%H-%M-%S)
                  mkdir -p "$BACKUP_DIR"

                  echo "Starting backup..."

                  # Step 1: Start consistent backup (forces checkpoint)
                  echo "Starting backup in PostgreSQL..."
                  psql -h ${DB_HOSTNAME} -U ${POSTGRES_USER} -d postgres -c "SELECT pg_start_backup('backup', true);"

                  # Step 2: Create full base backup
                  echo "Creating base backup..."
                  pg_basebackup -h ${DB_HOSTNAME} -U ${POSTGRES_USER} -D "$BACKUP_DIR" -Ft -z -P

                  # Step 3: Stop backup
                  echo "Stopping backup..."
                  psql -h ${DB_HOSTNAME} -U ${POSTGRES_USER} -d postgres -c "SELECT pg_stop_backup();"

                  echo "Backup created: $BACKUP_DIR"

                  # Step 4: Verify backup integrity
                  if [ "{{ .Values.backup.verifyEnabled }}" = "true" ]; then
                    echo "Verifying backup integrity..."

                    # Check base.tar.gz exists and is non-empty
                    if [ ! -s "$BACKUP_DIR/base.tar.gz" ]; then
                      echo "ERROR: base.tar.gz is missing or empty"
                      exit 1
                    fi

                    # Check tar integrity
                    if ! tar -tzf "$BACKUP_DIR/base.tar.gz" > /dev/null 2>&1; then
                      echo "ERROR: base.tar.gz is corrupted"
                      exit 1
                    fi

                    # Check pg_wal.tar.gz exists and is non-empty
                    if [ ! -s "$BACKUP_DIR/pg_wal.tar.gz" ]; then
                      echo "ERROR: pg_wal.tar.gz is missing or empty"
                      exit 1
                    fi

                    # Check tar integrity
                    if ! tar -tzf "$BACKUP_DIR/pg_wal.tar.gz" > /dev/null 2>&1; then
                      echo "ERROR: pg_wal.tar.gz is corrupted"
                      exit 1
                    fi

                    echo "Backup verification passed."
                  fi

                  # Step 5: Rotate old backups (only after successful verification)
                  echo "Rotating old backups..."
                  ls -drt /backups/${HELM_RELEASE_NAME}_backup_* 2>/dev/null | head -n -{{ .Values.backup.maxBackups }} | xargs -r rm -rf

                  echo "Backup complete."
              env:
                - name: HELM_RELEASE_NAME
                  value: "{{ .Release.Name }}"
                - name: DB_HOSTNAME
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Release.Name }}-env"
                      key: DB_HOSTNAME
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Release.Name }}-env"
                      key: DB_USERNAME
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Release.Name }}-env"
                      key: DB_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Release.Name }}-env"
                      key: DB_DATABASE_NAME
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: "{{ .Release.Name }}-postgres-db-pvc"
          restartPolicy: OnFailure
